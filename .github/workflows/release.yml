# Push a tag like v0.1.0 (matching touff/touff/__init__.py __version__) to build the
# Windows installer + portable zip and attach them to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual run: build only, artifacts on the run page

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: touff
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: App environment
        run: |
          uv venv .venv --python 3.12
          uv pip install --python .venv\Scripts\python.exe -e ".[dev,build]"

      - name: Tests
        run: .venv\Scripts\python.exe -m pytest -q

      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $v = ([regex]'__version__ = "([^"]+)"').Match((Get-Content touff\__init__.py -Raw)).Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match __version__ $v" }

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -RequireInstaller

      - uses: actions/upload-artifact@v4
        with:
          name: touff-windows
          path: |
            touff/packaging/dist/Touff-Setup-*.exe
            touff/packaging/dist/Touff-*-portable.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            touff/packaging/dist/Touff-Setup-*.exe
            touff/packaging/dist/Touff-*-portable.zip
