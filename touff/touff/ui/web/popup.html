<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Touff</title>
<style>
  :root {
    --c1: #f3eaff; --c2: #b48eff; --c3: #7c4dff; --c4: #5a2bd8; --ink: #1d1430;
    --glow: 139, 92, 246; --lvl: 0;
    --spring: cubic-bezier(.34, 1.56, .64, 1); --ease: cubic-bezier(.22, 1, .36, 1);
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: flex-end; justify-content: flex-end; gap: 2px;
    padding: 6px 6px 8px; box-sizing: border-box; opacity: 0; transform: translateY(14px) scale(.94); transform-origin: 85% 85%;
    filter: blur(2px); transition: opacity .26s var(--ease), transform .5s var(--spring), filter .26s; }
  #wrap.on { opacity: 1; transform: none; filter: none; }

  /* ---------- speech bubble ---------- */
  .bubble { position: relative; max-width: 222px; min-width: 64px; margin: 0 2px 34px 0; padding: 10px 14px 11px;
    border-radius: 18px 18px 5px 18px; color: #f6f2ff; font-size: 13.5px; line-height: 1.42;
    background: linear-gradient(160deg, rgba(40, 32, 66, .94), rgba(17, 13, 30, .94));
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .1), 0 1px 0 rgba(255, 255, 255, .12) inset, 0 12px 28px -6px rgba(0, 0, 0, .55), 0 0 26px -10px rgba(var(--glow), .9);
    transition: opacity .25s var(--ease), transform .45s var(--spring), box-shadow .5s; transform-origin: 100% 100%; }
  .bubble::after { content: ""; position: absolute; right: -5px; bottom: 9px; width: 10px; height: 10px; transform: rotate(45deg); border-radius: 2px;
    background: rgba(18, 14, 32, .94); box-shadow: 1px -1px 0 rgba(255, 255, 255, .08); }
  .bubble.empty { opacity: 0; transform: translateX(10px) scale(.9); }
  .scroll { max-height: 128px; overflow: hidden; position: relative; }
  .scroll.over { -webkit-mask-image: linear-gradient(transparent, #000 22px); mask-image: linear-gradient(transparent, #000 22px); }
  .heard { color: #b9addb; font-size: 12px; margin-bottom: 4px; display: flex; gap: 6px; align-items: baseline; }
  .heard::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: #8f84b3; transform: translateY(-1px); }
  .heard:empty { display: none; }
  .heard span { font-style: italic; }
  .said { white-space: pre-wrap; word-wrap: break-word; }
  .said .caret { display: inline-block; width: 2px; height: 1em; margin-left: 1px; vertical-align: -2px; border-radius: 1px; background: rgba(var(--glow), 1); animation: caret .8s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  .typing { display: none; gap: 4px; padding: 5px 0 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: rgba(var(--glow), 1); animation: bounce 1.1s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: .14s; } .typing i:nth-child(3) { animation-delay: .28s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-5px); opacity: 1; } }
  .waiting .typing { display: inline-flex; }
  .thinking .heard span { background: linear-gradient(90deg, #b9addb 0 40%, #fff 50%, #b9addb 60% 100%); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 1.6s linear infinite; }
  @keyframes sheen { from { background-position: 100% 0; } to { background-position: -150% 0; } }

  /* ---------- the orb ---------- */
  .orb { position: relative; width: 140px; height: 140px; flex: none; }
  #wrap.on .orb { animation: popin .6s var(--spring) both; }
  @keyframes popin { from { transform: scale(.55); } }
  canvas { position: absolute; inset: 0; width: 140px; height: 140px; }
  .glow { position: absolute; inset: 18px; border-radius: 50%; background: radial-gradient(closest-side, rgba(var(--glow), .75), rgba(var(--glow), 0));
    opacity: calc(.45 + var(--lvl) * .5); transform: scale(calc(1.05 + var(--lvl) * .25)); transition: background .5s; }
  .body { position: absolute; inset: 24px; border-radius: 52% 48% 46% 54% / 55% 50% 50% 45%;
    background: radial-gradient(circle at 34% 26%, var(--c1) 0, var(--c2) 36%, var(--c3) 70%, var(--c4) 100%);
    box-shadow: 0 10px 22px -6px rgba(10, 0, 30, .55), inset -9px -12px 22px rgba(40, 10, 110, .45), inset 5px 7px 14px rgba(255, 255, 255, .28);
    animation: wobble 5s ease-in-out infinite; transform: scale(calc(1 + var(--lvl) * .09)); transition: background .5s, box-shadow .5s; }
  .shine { position: absolute; left: 19%; top: 11%; width: 32%; height: 18%; border-radius: 50%; background: rgba(255, 255, 255, .5); filter: blur(3px); transform: rotate(-20deg); }
  @keyframes wobble {
    0%, 100% { border-radius: 52% 48% 46% 54% / 55% 50% 50% 45%; }
    33% { border-radius: 46% 54% 52% 48% / 48% 56% 44% 52%; }
    66% { border-radius: 55% 45% 48% 52% / 52% 46% 54% 48%; }
  }
  .face { position: absolute; inset: 0; transition: transform .45s var(--spring); }
  .eye { position: absolute; top: 38%; width: 11px; height: 17px; background: var(--ink); border-radius: 50%;
    animation: blink 4.7s infinite; transition: height .25s var(--spring), top .25s var(--spring), width .25s, border-radius .25s; }
  .eye.l { left: 30%; } .eye.r { right: 30%; animation-delay: .03s; }
  .eye::after { content: ""; position: absolute; width: 4.5px; height: 4.5px; top: 3px; left: 2px; background: #fff; border-radius: 50%; transition: opacity .2s; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  .brow { position: absolute; top: 28%; width: 14px; height: 3.5px; background: var(--ink); border-radius: 3px; opacity: 0; transition: .3s var(--spring); }
  .brow.l { left: 27%; } .brow.r { right: 27%; }
  .mouth { position: absolute; left: 50%; top: 62%; width: 15px; transform: translateX(-50%);
    height: calc(5px + var(--lvl) * 12px); background: var(--ink); border-radius: 3px 3px 11px 11px; transition: width .25s var(--spring), border-radius .25s; }
  .cheek { position: absolute; top: 57%; width: 12px; height: 7px; border-radius: 50%; background: rgba(255, 120, 180, .62); filter: blur(.4px); transition: opacity .3s; }
  .cheek.l { left: 16%; } .cheek.r { right: 16%; }

  .status { position: absolute; left: 50%; bottom: -3px; transform: translateX(-50%); max-width: 150px; padding: 2px 10px; border-radius: 99px;
    font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #efe8ff;
    background: rgba(17, 13, 30, .86); box-shadow: 0 0 0 1px rgba(255, 255, 255, .1), 0 6px 14px -4px rgba(0, 0, 0, .5);
    transition: opacity .25s, transform .35s var(--spring); }
  .status:empty { opacity: 0; transform: translate(-50%, 4px) scale(.9); }
  .status span { background: linear-gradient(90deg, #cbbcff 0 40%, #fff 50%, #cbbcff 60% 100%); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 1.8s linear infinite; }

  /* ---------- states ---------- */
  .idle .mouth { height: 6px; border-radius: 0 0 11px 11px; width: 16px; }
  .listening { --glow: 56, 189, 248; }
  .listening .eye { height: 19px; top: 35%; }
  .listening .face { transform: translateY(-2px); }
  .listening .mouth { width: 9px; height: calc(8px + var(--lvl) * 4px); border-radius: 50%; }
  .thinking { --glow: 168, 85, 247; }
  .thinking .face { transform: translate(5px, -5px); }
  .thinking .eye { height: 14px; }
  .thinking .eye::after { top: 1px; left: 5px; }
  .thinking .mouth { width: 10px; height: 4px; border-radius: 3px; transform: translateX(-30%); }
  .thinking .body { animation: wobble 5s ease-in-out infinite, ponder 2.4s ease-in-out infinite; }
  @keyframes ponder { 50% { rotate: 5deg; } }
  .speaking { --glow: 236, 72, 153; }
  .sassy { --c1: #ffe1e7; --c2: #ff7b95; --c3: #f0335c; --c4: #a3122f; --glow: 244, 63, 94; }
  .sassy .body { box-shadow: 0 10px 22px -6px rgba(30, 0, 8, .55), inset -9px -12px 22px rgba(100, 0, 25, .45), inset 5px 7px 14px rgba(255, 255, 255, .25);
    animation: wobble 5s ease-in-out infinite, huff 1.8s ease-in-out infinite; }
  .sassy .brow { opacity: 1; }
  .sassy .brow.l { transform: translateY(-4px) rotate(-14deg); }
  .sassy .brow.r { transform: rotate(12deg); }
  .sassy .eye { height: 9px; top: 42%; border-radius: 3px 3px 10px 10px; }
  .sassy .eye::after { opacity: 0; }
  .sassy .mouth { border-radius: 11px 3px 11px 3px; }
  .sassy .face { transform: translateX(-2px); }
  @keyframes huff { 0%, 100% { translate: 0 0; } 50% { translate: 0 -3px; } }
</style>
</head>
<body>
<div id="wrap" class="idle">
  <div class="bubble empty" id="bubble">
    <div class="scroll" id="scroll">
      <div class="heard" id="heard"></div>
      <div class="said" id="said"></div>
      <div class="typing"><i></i><i></i><i></i></div>
    </div>
  </div>
  <div class="orb">
    <div class="glow"></div>
    <canvas id="ring" width="140" height="140"></canvas>
    <div class="body">
      <div class="shine"></div>
      <div class="face">
        <div class="brow l"></div><div class="brow r"></div>
        <div class="eye l"></div><div class="eye r"></div>
        <div class="cheek l"></div><div class="cheek r"></div>
        <div class="mouth"></div>
      </div>
    </div>
    <div class="status" id="status"></div>
  </div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const wrap = $("wrap"), bubble = $("bubble"), scroll = $("scroll");
  let fresh = true, state = "idle", saidText = "", typer = 0;

  // ---- API used by Python (names and meaning unchanged) ----
  function setState(s) {
    state = s;
    wrap.className = s + " on";
    if (s === "listening" && fresh) { $("heard").textContent = ""; showSaid(""); bubble.classList.add("empty"); }
    fresh = false;
    syncBubble(); run();
  }
  function setHeard(text) {
    $("heard").innerHTML = "";
    const sp = document.createElement("span"); sp.textContent = "“" + text + "”"; $("heard").appendChild(sp);
    showSaid("");
    bubble.classList.remove("empty");
    syncBubble();
  }
  function setSaid(text) {
    showSaid(text || "");
    bubble.classList.toggle("empty", !text && !$("heard").textContent);
    syncBubble();
  }
  function setStatus(text) {
    const el = $("status"); el.innerHTML = "";
    if (text && text !== "Ready") { const sp = document.createElement("span"); sp.textContent = text; el.appendChild(sp); }
  }
  function lvl(x) {
    target = Math.max(0, Math.min(1, Number(x) || 0));
    // if frames aren't being drawn (window occluded/throttled), still move the mouth
    if (performance.now() - lastFrame > 250) document.documentElement.style.setProperty("--lvl", target.toFixed(3));
    run();
  }
  function fadeOut() { wrap.classList.remove("on"); fresh = true; }

  // ---- bubble: typewriter reveal, waiting dots, auto-scroll ----
  function showSaid(text) {
    clearInterval(typer);
    saidText = text;
    const el = $("said");
    if (!text) { el.textContent = ""; return; }
    let i = 0;
    const per = Math.max(1, Math.ceil(text.length / 90)); // long replies type faster
    const caret = document.createElement("span"); caret.className = "caret";
    typer = setInterval(() => {
      i = Math.min(text.length, i + per);
      el.textContent = text.slice(0, i);
      if (i < text.length) el.appendChild(caret); else clearInterval(typer);
      fit();
    }, 24);
  }
  function syncBubble() {
    const waiting = !saidText && !!$("heard").textContent && (state === "thinking" || state === "listening");
    bubble.classList.toggle("waiting", waiting);
    fit();
  }
  function fit() {
    scroll.scrollTop = scroll.scrollHeight;
    scroll.classList.toggle("over", scroll.scrollHeight > scroll.clientHeight + 1);
  }

  // ---- audio-reactive ring ----
  const cv = $("ring"), ctx = cv.getContext("2d");
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  cv.width = 140 * dpr; cv.height = 140 * dpr; ctx.scale(dpr, dpr);
  const N = 56, CX = 70, CY = 70, R = 51;
  const PALETTE = {
    idle: ["#c4b5fd", "#a78bfa", "#f0abfc"],
    listening: ["#5eead4", "#38bdf8", "#a78bfa"],
    thinking: ["#c084fc", "#818cf8", "#f0abfc"],
    speaking: ["#f0abfc", "#a78bfa", "#f472b6"],
    sassy: ["#fb7185", "#f43f5e", "#fdba74"],
  };
  let target = 0, level = 0, raf = 0, t0 = performance.now(), lastFrame = 0;
  const bars = new Float32Array(N);

  function run() { if (!raf) raf = requestAnimationFrame(frame); }
  function frame(now) {
    raf = 0; lastFrame = now;
    const t = (now - t0) / 1000;
    level += (target - level) * (target > level ? .35 : .12);
    document.documentElement.style.setProperty("--lvl", level.toFixed(3));
    draw(t);
    if (wrap.classList.contains("on") || level > .01) raf = requestAnimationFrame(frame);
  }
  function draw(t) {
    ctx.clearRect(0, 0, 140, 140);
    const pal = PALETTE[state] || PALETTE.idle;
    const g = ctx.createConicGradient(t * .6, CX, CY);
    g.addColorStop(0, pal[0]); g.addColorStop(.33, pal[1]); g.addColorStop(.66, pal[2]); g.addColorStop(1, pal[0]);
    ctx.strokeStyle = g; ctx.lineCap = "round";

    if (state === "thinking") {
      // a comet orbiting the orb + faint track
      ctx.globalAlpha = .28; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(CX, CY, R + 4, 0, Math.PI * 2); ctx.stroke();
      ctx.shadowColor = pal[0]; ctx.shadowBlur = 10;
      for (const off of [0, Math.PI]) {
        const head = t * 4.2 + off;
        for (let k = 0; k < 30; k++) {
          const a = head - k * .065;
          ctx.globalAlpha = 1 - k / 30; ctx.lineWidth = 5.5 * (1 - k / 34);
          ctx.beginPath(); ctx.arc(CX, CY, R + 4, a, a + .075); ctx.stroke();
        }
      }
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
      return;
    }
    const idle = state === "idle";
    const amp = idle ? 2.2 : 4 + level * 20;
    const spiky = state === "sassy";
    ctx.lineWidth = idle ? 2 : 2.6;
    ctx.globalAlpha = idle ? .55 : .5 + level * .5;
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2 - Math.PI / 2;
      // smooth organic wave, mirrored so it feels balanced
      const m = Math.min(i, N - i) / N * Math.PI * 2;
      let w = .55 + .45 * Math.sin(m * 3 + t * 3.1) * Math.sin(m * 1.7 - t * 2.3);
      if (spiky) w = .35 + .65 * Math.abs(Math.sin(i * 1.9 + t * 9));
      if (idle) w = .6 + .4 * Math.sin(t * 1.6 + i * .45);
      const len = 1.5 + amp * w;
      bars[i] += (len - bars[i]) * .35;
      const r0 = R, r1 = R + bars[i];
      ctx.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0);
      ctx.lineTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
</script>
</body>
</html>
