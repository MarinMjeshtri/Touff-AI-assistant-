[project]
name = "touff"
version = "0.1.0"
description = "Lightweight voice assistant for Windows that wakes on its name and does things for you."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sounddevice>=0.4",
    "numpy>=1.26",
    "vosk>=0.3.45",
    "faster-whisper>=1.0",
    "webrtcvad-wheels>=2.0.14",
    "piper-tts>=1.2",
    "rapidfuzz>=3.0",
    "soundfile>=0.12",
    "pywebview>=5.0",
    "pystray>=0.19",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
touff = "touff.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["touff*"]

[tool.setuptools.package-data]
touff = ["ui/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
